name: Server Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yaml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yaml"

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  unit:
    name: Lint, typecheck & unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Vitest
        run: bun run test

  e2e:
    name: Playwright API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: server/package.json

      # `next dev` runs on Node.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # API-only suite (the `request` fixture): no browsers to install.
      - name: Playwright
        run: bun run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            server/playwright-report
            server/test-results
          retention-days: 7
