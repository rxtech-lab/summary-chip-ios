# XcodeGen spec. Regenerate the project with:
#   xcodegen generate --spec /Users/qiweili/Desktop/rxlab/summary-chip-ios/project.yml
name: summary-chip

options:
  bundleIdPrefix: com.rxlab
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"
  # XcodeGen 2.45 maps .icon to the legacy type; Xcode needs the Icon Composer type.
  # It also only lists regions it finds in .lproj folders, so add the String Catalog languages.
  postGenCommand: >-
    perl -pi -e 's/lastKnownFileType = wrapper\.icon;/lastKnownFileType = folder.iconcomposer.icon;/g' summary-chip.xcodeproj/project.pbxproj &&
    perl -0pi -e 's/(knownRegions = \(\n(\s*)Base,\n\s*en,\n)/$1$2"zh-Hans",\n$2"zh-Hant",\n/' summary-chip.xcodeproj/project.pbxproj

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: T7GYB573Y6
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SUMMARY_CHIP_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.rxlab.summary-chip.shared

packages:
  RxSubscriptionIOS:
    url: https://github.com/rxtech-lab/RxSubscriptionIOS
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  SummaryKit:
    path: Packages/SummaryKit
  RxAuthSwift:
    url: https://github.com/rxtech-lab/RxAuthSwift
    from: 1.3.1
  RxAgentSDK:
    url: https://github.com/rxtech-lab/RxAgentSDK
    from: 1.0.8

# Info.plist keys every target reads through SummaryConfiguration.
x-config-info: &configInfo
  SummaryChipAPIBaseURL: $(SUMMARY_CHIP_API_BASE_URL)
  SummaryChipSiteHost: $(SUMMARY_CHIP_SITE_HOST)
  SummaryChipIOSClientID: $(SUMMARY_CHIP_IOS_CLIENT_ID)
  SummaryChipOAuthIssuer: $(SUMMARY_CHIP_OAUTH_ISSUER)
  SummaryChipOAuthRedirectURI: $(SUMMARY_CHIP_OAUTH_REDIRECT_URI)
  SummaryChipAuthTokenURL: $(SUMMARY_CHIP_AUTH_TOKEN_URL)
  SummaryChipKeychainAccessGroup: $(SUMMARY_CHIP_KEYCHAIN_GROUP)
  ITSAppUsesNonExemptEncryption: false
  NSAppTransportSecurity:
    NSAllowsLocalNetworking: true

x-shared-entitlements: &sharedEntitlements
  keychain-access-groups:
    - $(AppIdentifierPrefix)com.rxlab.summary-chip.shared
  com.apple.security.application-groups:
    - group.com.rxlab.summary-chip

targets:
  MacSmartShare:
    type: app-extension
    platform: macOS
    sources:
      - path: MacSmartShare
        excludes:
          - Info.plist
          - MacSmartShare.entitlements
      - path: SmartShare/ShareRootView.swift
    dependencies:
      - package: SummaryKit
    info:
      path: MacSmartShare/Info.plist
      properties:
        <<: *configInfo
        CFBundleDisplayName: Chippy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (
                extensionItems, $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments, $attachment,
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.rtfd"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.flat-rtfd"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.wordprocessingml.document"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.microsoft.word.doc"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.oasis-open.opendocument.text"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.spreadsheetml.sheet"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.openxmlformats.presentationml.presentation"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.oasis-open.opendocument.spreadsheet"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.oasis-open.opendocument.presentation"
                ).@count >= 1
              ).@count == 1
    entitlements:
      path: MacSmartShare/MacSmartShare.entitlements
      properties:
        <<: *sharedEntitlements
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.MacSmartShare
        PRODUCT_NAME: MacSmartShare
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        REGISTER_APP_GROUPS: YES

  summary-chip-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: summary-chipTests
    dependencies:
      - target: summary-chip
      - package: SummaryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.macOSTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Chippy.app/Contents/MacOS/Chippy
        GENERATE_INFOPLIST_FILE: YES

  summary-chip-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: summary-chipMacUITests
    dependencies:
      - target: summary-chip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.macOSUITests
        GENERATE_INFOPLIST_FILE: YES

  summary-chip:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: summary-chip
        excludes:
          - Info.plist
          - summary-chip.entitlements
      - path: Chippy.icon
        type: file
        buildPhase: resources
    groups:
      - summary-chip-macOS
    dependencies:
      - package: Sparkle
        destinationFilters: [macOS]
      - package: SummaryKit
      - package: RxAuthSwift
        product: RxAuthSwift
      - package: RxAuthSwift
        product: RxAuthSwiftUI
      - package: RxAgentSDK
        product: RxAgentSDK
      - package: RxSubscriptionIOS
      - target: MacSmartShare
        destinationFilters: [macOS]
      - target: SmartShare
        destinationFilters: [iOS]
      - target: SummaryMessages
        destinationFilters: [iOS]
      - target: SummaryClip
        destinationFilters: [iOS]
    info:
      path: summary-chip/Info.plist
      properties:
        <<: *configInfo
        SummaryChipPushEnvironment: $(SUMMARY_CHIP_PUSH_ENVIRONMENT)
        CFBundleDisplayName: Chippy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.rxlab.summary-chip
            CFBundleURLSchemes: [summarychip]
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: summary-chip/summary-chip.entitlements
      properties:
        <<: *sharedEntitlements
        aps-environment: $(SUMMARY_CHIP_PUSH_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:summary.rxlab.app
          - webcredentials:rxlab.app
          - appclips:summary.rxlab.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip
        CODE_SIGN_IDENTITY: Apple Development
        PRODUCT_NAME: summary-chip
        PRODUCT_MODULE_NAME: summary_chip
        "PRODUCT_NAME[sdk=macosx*]": Chippy
        ASSETCATALOG_COMPILER_APPICON_NAME: Chippy
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "INFOPLIST_FILE[sdk=macosx*]": summary-chip-macOS/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": summary-chip-macOS/summary-chip-macOS.entitlements
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": Chippy
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_INCOMING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "REGISTER_APP_GROUPS[sdk=macosx*]": YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"

  SmartShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SmartShare
        excludes:
          - "*.js"
      - path: SmartShare/ExtractContent.js
        buildPhase: resources
    dependencies:
      - package: SummaryKit
    info:
      path: SmartShare/Info.plist
      properties:
        <<: *configInfo
        CFBundleDisplayName: Chippy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: ExtractContent
            NSExtensionActivationRule: >-
              SUBQUERY (
                extensionItems, $extensionItem,
                SUBQUERY (
                  $extensionItem.attachments, $attachment,
                  ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.property-list"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.rtfd"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.flat-rtfd"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url"
                  || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "net.daringfireball.markdown"
                ).@count >= 1
              ).@count == 1
    entitlements:
      path: SmartShare/SmartShare.entitlements
      properties:
        <<: *sharedEntitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.SmartShare
        PRODUCT_NAME: SmartShare
        APPLICATION_EXTENSION_API_ONLY: YES

  SummaryMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: SummaryMessages
    dependencies:
      - package: SummaryKit
    info:
      path: SummaryMessages/Info.plist
      properties:
        <<: *configInfo
        CFBundleDisplayName: Chippy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MSSupportedPresentationContexts:
          - MSMessagesAppPresentationContextMessages
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: SummaryMessages/SummaryMessages.entitlements
      properties:
        <<: *sharedEntitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.Messages
        PRODUCT_NAME: SummaryMessages
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon

  SummaryClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: SummaryClip
      - path: Chippy.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SummaryKit
    info:
      path: SummaryClip/Info.plist
      properties:
        <<: *configInfo
        CFBundleDisplayName: Chippy
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: SummaryClip/SummaryClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.rxlab.summary-chip
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.associated-domains:
          - appclips:summary.rxlab.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chip.Clip
        PRODUCT_NAME: SummaryClip
        ASSETCATALOG_COMPILER_APPICON_NAME: Chippy
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  summary-chipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: summary-chipTests
    dependencies:
      - target: summary-chip
      - package: SummaryKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chipTests
        GENERATE_INFOPLIST_FILE: YES

  summary-chipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: summary-chipUITests
    dependencies:
      - target: summary-chip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rxlab.summary-chipUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  summary-chip-macOS:
    build:
      targets:
        summary-chip: all
        summary-chip-macOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - summary-chip-macOSTests
        - summary-chip-macOSUITests
        - package: SummaryKit/SummaryKitTests
    profile:
      config: Release
    archive:
      config: Release
  summary-chip:
    build:
      targets:
        summary-chip: all
        summary-chipTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - summary-chipTests
        - summary-chipUITests
        - package: SummaryKit/SummaryKitTests
    profile:
      config: Release
    archive:
      config: Release
  SummaryClip:
    build:
      targets:
        SummaryClip: all
    run:
      config: Debug
      environmentVariables:
        _XCAppClipURL: https://summary.rxlab.app/s/a1B2c3D4e5
    archive:
      config: Release
  SmartShare:
    build:
      targets:
        SmartShare: all
        summary-chip: all
    run:
      config: Debug
      askForAppToLaunch: true
  SummaryMessages:
    build:
      targets:
        SummaryMessages: all
        summary-chip: all
    run:
      config: Debug
      askForAppToLaunch: true
